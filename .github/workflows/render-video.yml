name: Render Video
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Render video
        run: cd packages/example && bunx remotion render HelloWorld out/video.mp4
      
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: packages/example/out/video.mp4
