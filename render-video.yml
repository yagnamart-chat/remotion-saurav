name: Render Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Video title'
        required: false
        default: 'My Test Video'
      subtitle:
        description: 'Subtitle'
        required: false
        default: 'Made with Remotion'
      duration:
        description: 'Duration in seconds'
        required: false
        default: '5'

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: |
          npx remotion render HelloWorld out/video.mp4 \
            --props='{"titleText":"${{ github.event.inputs.title }}","titleColor":"white"}'

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
          retention-days: 7
